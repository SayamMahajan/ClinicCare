<app-toolbar
  (logout)="onLogout()"
  (profile)="onProfile()">
</app-toolbar>

<mat-sidenav-container class="vh-100">

  <mat-sidenav
    mode="side"

  <mat-sidenav-content class="p-4 bg-light">
    <router-outlet />
  </mat-sidenav-content>

</mat-sidenav-container>
