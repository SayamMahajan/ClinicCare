<div class="pagination-container d-flex justify-content-between align-items-center mt-4">
  <div class="page-info text-muted">
    <small>Page {{ currentPage() }} of {{ totalPages() }}</small>
  </div>

  <nav aria-label="Page navigation">
    <ul class="pagination mb-0">
      <li class="page-item" [class.disabled]="!hasPrevious()">
        <button
          class="page-link"
          (click)="onPrevious()"
          [disabled]="!hasPrevious()"
          aria-label="Previous"
        >
          <mat-icon class="pagination-icon">chevron_left</mat-icon>
          <span class="ms-1">Previous</span>
        </button>
      </li>

      @for (page of getDisplayedPages(); track $index) {
        @if (isNumber(page)) {
          <li class="page-item" [class.active]="page === currentPage()">
            <button class="page-link" (click)="onPageClick(page)">
              {{ page }}
            </button>
          </li>
        } @else {
          <li class="page-item disabled">
            <span class="page-link">{{ page }}</span>
          </li>
        }
      }

      <li class="page-item" [class.disabled]="!hasNext()">
        <button
          class="page-link"
          (click)="onNext()"
          [disabled]="!hasNext()"
          aria-label="Next"
        >
          <span class="me-1">Next</span>
          <mat-icon class="pagination-icon">chevron_right</mat-icon>
        </button>
      </li>
    </ul>
  </nav>

  <div class="page-size-selector d-flex align-items-center gap-2">
    <label class="text-muted mb-0" for="pageSizeSelect">
      <small>Per page:</small>
    </label>
    <select
      id="pageSizeSelect"
      class="form-select form-select-sm"
      [value]="pageSize()"
      (change)="onPageSizeChange($event)"
      style="width: 80px"
    >
      <option [value]="5">5</option>
      <option [value]="10">10</option>
      <option [value]="20">20</option>
      <option [value]="50">50</option>
      <option [value]="100">100</option>
    </select>
  </div>
</div>
