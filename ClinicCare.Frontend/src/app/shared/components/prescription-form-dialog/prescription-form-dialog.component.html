<h2 mat-dialog-title>Add Prescription</h2>

<mat-dialog-content>

  <p class="mb-2">
    <strong>Patient:</strong> {{ data.patientName }} <br />
    <strong>Doctor:</strong> {{ data.doctorName }}
  </p>

  <form [formGroup]="form">

    <div formArrayName="description">

      @for (med of medications.controls; let i = $index; track i) {

        <mat-card class="mb-3">
          <mat-card-content [formGroupName]="i">

            <div class="row g-2">

              <div class="col-md-4">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Medicine</mat-label>
                  <input matInput formControlName="medicine" />
                </mat-form-field>
              </div>

              <div class="col-md-2">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Dosage</mat-label>
                  <input matInput type="number" formControlName="dosage" />
                </mat-form-field>
              </div>

              <div class="col-md-3">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Frequency</mat-label>
                  <input matInput formControlName="frequency" />
                </mat-form-field>
              </div>

              <div class="col-md-2">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Days</mat-label>
                  <input matInput type="number" formControlName="days" />
                </mat-form-field>
              </div>

              <div class="col-md-1 d-flex align-items-center">
                <button
                  mat-icon-button
                  color="warn"
                  (click)="removeMedication(i)"
                  [disabled]="medications.length === 1"
                >
                  <mat-icon>delete</mat-icon>
                </button>
              </div>

              <div class="col-md-12">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Instructions</mat-label>
                  <textarea matInput formControlName="instructions"></textarea>
                </mat-form-field>
              </div>

            </div>

          </mat-card-content>
        </mat-card>

      }

    </div>

  </form>

  <button mat-stroked-button color="primary" (click)="addMedication()">
    + Add Medicine
  </button>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="submit()">
    Save Prescription
  </button>
</mat-dialog-actions>
