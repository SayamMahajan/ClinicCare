<h2 mat-dialog-title>Employee Details</h2>

<mat-dialog-content>

  <mat-list>

    <mat-list-item>
      <strong>First Name:</strong>&nbsp;
      {{ data.employee.firstName }}
    </mat-list-item>

    <mat-list-item>
      <strong>Last Name:</strong>&nbsp;
      {{ data.employee.lastName }}
    </mat-list-item>

    <mat-list-item>
      <strong>Email:</strong>&nbsp;
      {{ data.employee.email }}
    </mat-list-item>

    <mat-list-item>
      <strong>Role:</strong>&nbsp;
      {{ data.employee.role }}
    </mat-list-item>

    <mat-list-item>
      <strong>Date of Joining:</strong>&nbsp;
      {{ data.employee.dateOfJoining }}
    </mat-list-item>

  </mat-list>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-raised-button
    color="primary"
    (click)="action('update')"
  >
    Update
  </button>

  <button
    mat-raised-button
    color="warn"
    (click)="action('delete')"
  >
    Remove
  </button>

  <button mat-button (click)="close()">Close</button>

</mat-dialog-actions>
