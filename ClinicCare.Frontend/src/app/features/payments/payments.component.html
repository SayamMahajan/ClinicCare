<div class="container-fluid p-4">

  <app-list-filter-bar
    searchLabel="Search payments"
    [options]="['Past Day', 'Past Week', 'Past Month']"
    label="Time Range"
    (searchChange)="search.set($event)"
  />

  <app-list-container [columns]="columns">

    @for (payment of filteredPayments(); track payment.id) {
      <app-list-row
        [values]="mapRow(payment)"
        (infoClick)="onInfoClick(payment)"
      />
    }

  </app-list-container>
</div>
