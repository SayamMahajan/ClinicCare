<mat-sidenav-container style="height: 100vh; background: #fafafd;">
  <mat-sidenav mode="side" opened style="width: 240px; box-shadow: 2px 0 8px #0001; display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 16px;">
    <div>
      <mat-toolbar color="primary" style="font-size: 1.3rem;">Dashboard</mat-toolbar>
      <mat-nav-list>
        <mat-list-item (click)="section = 'upcoming'" [class.selected]="section === 'upcoming'" style="cursor:pointer;">
          <mat-icon style="margin-right: 12px;">schedule</mat-icon>
          <span>Upcoming</span>
        </mat-list-item>
        <mat-list-item (click)="section = 'past'" [class.selected]="section === 'past'" style="cursor:pointer;">
          <mat-icon style="margin-right: 12px;">history</mat-icon>
          <span>Past</span>
        </mat-list-item>
      </mat-nav-list>
    </div>
    <div style="padding: 0 16px;">
      <button mat-raised-button color="warn" style="width: 100%;" (click)="logout()">Logout</button>
    </div>
  </mat-sidenav>
  <mat-sidenav-content style="padding: 32px 48px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
      <div></div>
      <mat-form-field appearance="outline" style="width: 340px; margin-right: 32px;">
        <mat-label>Search appointments</mat-label>
        <input matInput [(ngModel)]="search">
        <button mat-icon-button matSuffix *ngIf="search" (click)="search = ''">
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>
      <mat-form-field appearance="outline" style="width: 200px;">
        <mat-label>Slot Type</mat-label>
        <mat-select [(ngModel)]="slotType">
          <mat-option value="">All</mat-option>
          <mat-option *ngFor="let type of slotTypes" [value]="type">{{ type | titlecase }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <mat-divider></mat-divider>
    <div style="margin-top: 32px; max-width: 900px;">
      <mat-list *ngIf="filteredAppointments.length; else noAppt">
        <mat-list-item *ngFor="let appt of filteredAppointments" (click)="goToAppointment(appt.id)" style="cursor:pointer; align-items: center;">
          <div style="display: flex; gap: 32px; align-items: center; width: 100%;">
            <span style="font-weight: bold; font-size: 1.1rem; min-width: 160px;">{{ appt.firstName }} {{ appt.lastName }}</span>
            <span style="color: #555; min-width: 120px;">{{ appt.date }}</span>
            <span style="color: #888; text-transform: capitalize; min-width: 100px;">{{ appt.slot }}</span>
          </div>
        </mat-list-item>
      </mat-list>
      <ng-template #noAppt>
        <div style="text-align:center; color:#888; margin-top:48px;">No appointments found.</div>
      </ng-template>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
