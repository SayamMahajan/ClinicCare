<div class="container-fluid p-4">
  <app-list-filter-bar
    searchLabel="Search"
    [options]="specializations()"
    label="Specialization"
    (searchChange)="search.set($event)"
    (optionChange)="selectedSpecialization.set($event)"
  />

  <h4 class="m-2">Select Doctor</h4>

  <mat-card class="mt-3">
    <mat-card-content
      class="overflow-auto"
      style="max-height: 250px;"
    >

      <app-list-container
        [columns]="['Doctor', 'Specialization', 'Experience', 'Fee', 'Phone', 'Action']"
      >
        @for (doc of filteredDoctors(); track doc.id) {
          <app-list-row
            [values]="[
              doc.firstName + ' ' + doc.lastName,
              doc.specialization,
              getExperienceYears(doc.firstPracticeDate),
              doc.fee ? '₹' + doc.fee : '-',
              doc.phone ?? '-'
            ]"
            actionType="select"
            [selected]="isSelected(doc)"
            [disabled]="!!selectedDoctor() && !isSelected(doc)"
            (selectClick)="toggleDoctor(doc)"
          />
        }
      </app-list-container>

    </mat-card-content>
  </mat-card>

  <mat-card class="mt-4">
    <mat-card-content>

      <h5 class="mb-3">Appointment Details</h5>

      <div class="row g-3">

        <div class="col-md-4">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Date</mat-label>
            <input
              matInput
              [matDatepicker]="picker"
              (dateChange)="selectedDate.set($event.value)"
            />
            <mat-datepicker-toggle matSuffix [for]="picker" />
            <mat-datepicker #picker />
          </mat-form-field>
        </div>

        <div class="col-md-4">
          <app-dropdown-filter
            label="Time Slot"
            [options]="['Morning', 'EarlyNoon', 'LateNoon', 'Evening', 'Night']"
            (valueChange)="onSlotChange($event)"
          />
        </div>

        <div class="col-md-4 d-flex align-items-end">
          <button
            mat-raised-button
            color="primary"
            class="w-100"
            [disabled]="!selectedDoctor() || !selectedDate() || !selectedSlot()"
            (click)="submit()"
          >
            Book Appointment
          </button>
        </div>

      </div>

    </mat-card-content>
  </mat-card>

</div>
